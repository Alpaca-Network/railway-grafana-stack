apiVersion: 1

groups:
  - orgId: 1
    name: backend_alerts
    folder: Backend Alerts
    interval: 1m
    rules:
      # Alert: System Health Degraded
      - uid: system_health_degraded
        title: System Health Degraded
        condition: C
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          description: 'Overall system health score is {{ $value }}%, below 80% threshold. Check backend services immediately.'
          summary: 'System health degraded'
          runbook_url: 'https://wiki.gatewayz.ai/runbooks/system-health'
        labels:
          severity: warning
          category: backend
          component: system_monitoring
        data:
          - refId: A
            queryType: ''
            model:
              expr: 'avg(health_score) < 80'
              hide: false
              intervalFactor: 1
              legendFormat: 'System Health'
              refId: A
          - refId: C
            queryType: ''
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  type: query
              type: threshold

      # Alert: Circuit Breaker Open
      - uid: circuit_breaker_open
        title: Circuit Breaker Open
        condition: C
        noDataState: NoData
        execErrState: Alerting
        for: 0m
        annotations:
          description: 'Circuit breaker for {{ $labels.service }} is OPEN. Service degradation detected.'
          summary: 'Circuit breaker opened for {{ $labels.service }}'
          runbook_url: 'https://wiki.gatewayz.ai/runbooks/circuit-breaker'
        labels:
          severity: critical
          category: backend
          component: reliability
        data:
          - refId: A
            queryType: ''
            model:
              expr: 'circuit_breaker_state{state="open"} == 1'
              hide: false
              intervalFactor: 1
              legendFormat: '{{ service }}'
              refId: A
          - refId: C
            queryType: ''
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  type: query
              type: threshold

      # Alert: Backend Error Rate High
      - uid: backend_error_rate_high
        title: Backend Error Rate High
        condition: C
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          description: 'Backend error rate is {{ $value }}%, exceeding 5% threshold. Investigate error logs.'
          summary: 'Backend error rate elevated'
          runbook_url: 'https://wiki.gatewayz.ai/runbooks/backend-errors'
        labels:
          severity: warning
          category: backend
          component: error_tracking
        data:
          - refId: A
            queryType: ''
            model:
              expr: '(avg(error_rate) * 100) > 5'
              hide: false
              intervalFactor: 1
              legendFormat: 'Backend Error Rate'
              refId: A
          - refId: C
            queryType: ''
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  type: query
              type: threshold

      # Alert: Provider Availability Low
      - uid: provider_availability_low
        title: Provider Availability Low
        condition: C
        noDataState: NoData
        execErrState: Alerting
        for: 10m
        annotations:
          description: 'Provider {{ $labels.provider }} availability is {{ $value }}%, below 95% threshold'
          summary: 'Provider {{ $labels.provider }} availability degraded'
          runbook_url: 'https://wiki.gatewayz.ai/runbooks/provider-availability'
        labels:
          severity: warning
          category: backend
          component: availability_tracking
        data:
          - refId: A
            queryType: ''
            model:
              expr: '(avg(provider_availability) by (provider)) < 95'
              hide: false
              intervalFactor: 1
              legendFormat: '{{ provider }}'
              refId: A
          - refId: C
            queryType: ''
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  type: query
              type: threshold
      # Alert: Event Loop Lag High — Server May Be Frozen
      # CRITICAL: noDataState=Alerting means a completely silent (frozen) server also fires this alert.
      # A server with a stuck event loop stops scraping /metrics entirely, so the metric disappears.
      # This alert fires BOTH when lag is high (early warning) AND when the metric is absent (full freeze).
      - uid: event_loop_lag_high
        title: "Event Loop Lag High — Server May Be Frozen"
        condition: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Event loop lag > 500ms sustained — server event loop is saturated or frozen"
          description: >
            gatewayz_event_loop_lag_seconds exceeded 500ms for 2+ minutes, or the metric has
            disappeared entirely (server frozen). Root causes: hung streaming provider connection,
            blocking sync code (time.sleep) in async context, thread pool exhaustion.
            Action: check active streams in Grafana → Distributed Tracing, verify Redis health,
            check process memory. If lag > 2s, redeploy the container immediately.
          runbook_url: 'https://wiki.gatewayz.ai/runbooks/event-loop-lag'
        labels:
          severity: critical
          category: backend
          component: event_loop
        data:
          - refId: A
            queryType: ''
            model:
              datasource:
                type: prometheus
                uid: grafana_prometheus
              expr: 'gatewayz_event_loop_lag_seconds'
              hide: false
              intervalFactor: 1
              legendFormat: 'Event Loop Lag (s)'
              refId: A
          - refId: C
            queryType: ''
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  type: query
              type: classic_conditions

    provenance: Grafana
